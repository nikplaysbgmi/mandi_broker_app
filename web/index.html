<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Mandi Trade Portal - Live Mandi Rates, Saudas & Broker Ledger Management">

  <!-- Apple iOS Standalone Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mandi Portal">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F766E">
  <meta name="color-scheme" content="light">

  <!-- Apple iOS Web Clip & Add to Home Screen Icons (Non-transparent 24bpp) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/apple-touch-icon-180x180.png">

  <!-- Standard Favicons & Web Manifest -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Mandi Trade Portal</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F1F5F9;
      color-scheme: light;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      overflow: hidden;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    @keyframes mandi-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background-color: #F1F5F9; margin: 0; padding: 0; overflow: hidden;">

  <!-- Branded iOS / Web Startup Splash Screen -->
  <div id="mandi-splash-screen" style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    background-color: #0B1320;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999999;
    transition: opacity 0.4s ease-out;
  ">
    <div style="
      width: 96px;
      height: 96px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1320;
    ">
      <img src="icons/Icon-192.png" width="96" height="96" alt="Mandi Portal" style="display: block; object-fit: cover;" />
    </div>
    <div style="
      margin-top: 18px;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.6px;
    ">MANDI TRADE PORTAL</div>
    <div style="
      margin-top: 6px;
      color: #14B8A6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
    ">Connecting Mandi Brokers, Buyers &amp; Sellers</div>
    <div style="
      margin-top: 24px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(20, 184, 166, 0.2);
      border-top-color: #14B8A6;
      border-radius: 50%;
      animation: mandi-spin 0.8s linear infinite;
    "></div>
  </div>

  <script>
    function hideMandiSplash() {
      var splash = document.getElementById('mandi-splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideMandiSplash);
    setTimeout(hideMandiSplash, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
