name: NCDEX Live Scrape & Sync

on:
  schedule:
    - cron: '*/15 4-12 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect Files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== ALL JAVASCRIPT FILES IN REPO ==="
          find . -maxdepth 3 -name "*.js"
          echo "=== ROOT FILES ==="
          ls -la

      - name: Install Dependencies
        run: npm install puppeteer firebase-admin
        