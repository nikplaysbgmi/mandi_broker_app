name: NCDEX Live Scrape & Sync

on:
  schedule:
    # Runs Monday to Friday every 15 minutes between 9:30 AM IST and 5:30 PM IST (04:00 - 12:00 UTC)
    - cron: '*/15 4-12 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install puppeteer firebase-admin

      - name: Execute Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ./scripts/ncdex_updater/fetch_ncdex.js
        