name: Update NCDEX Live Bhav

on:
  schedule:
    # Runs every 15 minutes between 03:30 and 11:30 UTC (09:00 AM to 05:00 PM IST), Monday to Friday
    - cron: '*/15 3-11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  update-bhav:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd scripts/ncdex_updater
          npm install

      - name: Fetch and Sync Rates
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node scripts/ncdex_updater/fetch_ncdex.js
          