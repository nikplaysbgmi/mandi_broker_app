name: Sync NCDEX Rates

on:
  schedule:
    # Runs every 15 minutes, Monday through Friday
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-sync:
    # Pinning to ubuntu-24.04 ensures stability and avoids unexpected runner changes
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install puppeteer firebase-admin

      - name: Run NCDEX Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node fetch_ncdex.js
          