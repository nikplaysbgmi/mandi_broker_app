name: Automatic NCDEX Sync

on:
  schedule:
    # Monday to Friday every 10 minutes between 03:30 UTC and 11:30 UTC (09:00 AM - 05:00 PM IST)
    - cron: '*/10 3-11 * * 1-5'
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/ncdex_updater
        run: npm install

      - name: Run NCDEX scraper & Firestore sync
        working-directory: scripts/ncdex_updater
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fetch_ncdex.js
        