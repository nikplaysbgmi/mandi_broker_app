name: Keep Workflow Alive Forever

on:
  schedule:
    # Runs on the 1st of every month at midnight UTC so GitHub never pauses scheduled cron workflows after 60 days of inactivity
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep NCDEX live sync cron active"
          git push
